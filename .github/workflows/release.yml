name: Release Markdown BBCode

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (defaults to package version tag)
        required: false
        type: string
      notes:
        description: Release notes summary
        required: false
        type: string
  push:
    tags:
      - "release/v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests, lint and Rust tests
        run: |
          npm test
          npm run lint
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build NSIS installer and updater signature
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "TAURI_SIGNING_PRIVATE_KEY secret is required to sign release artifacts."
          }
          npm run build:installer

      - name: Package and sign portable archive + generate manifests
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $version = $pkg.version
          $tag = if ($env:INPUT_TAG) { $env:INPUT_TAG } elseif ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "v$version" }
          $notes = if ($env:INPUT_NOTES) { $env:INPUT_NOTES } else { "Markdown BBCode $version" }

          New-Item -ItemType Directory -Force release-assets, nsis-staging | Out-Null
          $portableZip = "release-assets/Markdown-BBCode-$version-portable-win-x64.zip"
          node scripts/package.mjs --zip $portableZip
          npx tauri signer sign --app-version $version $portableZip

          $nsisExe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          $nsisSig = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe.sig" | Select-Object -First 1
          if (-not $nsisExe -or -not $nsisSig) {
            throw "NSIS installer or updater signature not found."
          }
          $cleanInstallerName = "Markdown-BBCode_${version}_x64-setup.exe"
          Copy-Item $nsisExe.FullName "nsis-staging/$cleanInstallerName"
          Copy-Item $nsisSig.FullName "nsis-staging/$cleanInstallerName.sig"
          Copy-Item "nsis-staging/*" release-assets/

          node scripts/generate-manifests.mjs `
            --version $version `
            --tag $tag `
            --repo "${{ github.repository }}" `
            --nsis-dir nsis-staging `
            --portable-zip $portableZip `
            --portable-sig "$portableZip.sig" `
            --notes $notes `
            --out-dir release-assets

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $version = $pkg.version
          $tag = if ($env:INPUT_TAG) { $env:INPUT_TAG } elseif ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "v$version" }
          $notes = if ($env:INPUT_NOTES) { $env:INPUT_NOTES } else { "Markdown BBCode $version" }
          $assets = Get-ChildItem release-assets | ForEach-Object { $_.FullName }

          $exists = $false
          try {
            gh release view $tag *> $null
            if ($LASTEXITCODE -eq 0) { $exists = $true }
          } catch {}

          if ($exists) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --title "Markdown BBCode $version" --notes $notes
          }
