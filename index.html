<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BBCode Editor</title>
  </head>
  <body>
    <header>
      <div class="brand"><span class="brand-mark">[b]</span><div><strong>BBCode Editor</strong><small>Markdown → Nexus BBCode</small></div></div>
      <nav aria-label="Files">
        <button id="new" title="New Document (Ctrl+N)">New</button>
        <button id="open" title="Open Document (Ctrl+O)">Open</button>
        <button id="import">Import BBCode</button>
        <button id="save" title="Save Markdown (Ctrl+S)">Save</button>
        <button id="save-as" title="Save As (Ctrl+Shift+S)">Save As</button>
        <button id="drafts" hidden>Drafts</button>
        <button id="recovered" hidden>Recovered BBCode</button>
      </nav>
      <button id="copy" class="primary" title="Copy BBCode (Ctrl+Shift+C)">Copy BBCode</button>
    </header>
    <div id="tabs" role="tablist" aria-label="Documents"></div>
    <main>
      <div class="document-bar">
        <div class="document-location"><div id="document-path">Recoverable Markdown Draft</div><small id="output-path">Save To Create A BBCode Copy</small></div>
        <div class="mode-switch" aria-label="Editor Mode"><button id="visual" aria-pressed="true">Visual</button><button id="source" aria-pressed="false">Source</button></div>
      </div>
      <div id="notice" role="status" hidden><span id="notice-text"></span><button id="resolve" hidden>Resolve Conflict</button><button id="retry" hidden>Retry Save</button></div>
      <div id="output-notice" role="status" hidden><span id="output-notice-text"></span><button id="regenerate">Regenerate BBCode</button></div>
      <section id="document-properties" aria-labelledby="properties-title">
        <strong id="properties-title">Document Properties</strong>
        <label for="document-target">Target</label>
        <select id="document-target" aria-describedby="target-note"><option value="nexus">Nexus Mods</option><option value="steam" disabled>Steam (Coming Later)</option><option id="unknown-target" value="unknown" disabled hidden>Unsupported Target</option></select>
        <span id="target-note"></span>
      </section>
      <div id="editor-host">
        <div id="format-toolbar" role="toolbar" aria-label="Formatting">
          <select id="heading" aria-label="Paragraph Style"><option value="0">Paragraph</option><option value="1">Heading 1</option><option value="2">Heading 2</option><option value="3">Heading 3</option><option value="4">Heading 4</option><option value="5">Heading 5</option><option value="6">Heading 6</option><option value="mixed" disabled>Mixed</option><option value="other" disabled>Other Block</option></select>
          <button data-format="bold" aria-label="Bold" title="Bold (Ctrl+B)"><b>B</b></button>
          <button data-format="italic" aria-label="Italic" title="Italic (Ctrl+I)"><i>I</i></button>
          <button data-format="strike" aria-label="Strikethrough" title="Strikethrough"><s>S</s></button>
          <span class="toolbar-divider"></span>
          <button data-format="bullet" title="Bullet List">Bullets</button><button data-format="numbered" title="Numbered List">Numbers</button>
          <button data-format="quote">Quote</button><button data-format="code">Code</button>
          <button data-format="link">Link</button><button data-format="image">Image</button>
          <span class="toolbar-divider"></span>
          <button data-format="spoiler">Spoiler</button><button data-format="center">Center</button>
          <span class="color-control"><button id="apply-color" aria-label="Apply Last Color" aria-pressed="false">Color <span id="last-color-swatch" aria-hidden="true"></span></button><button id="choose-color" aria-label="Choose Text Color" title="Choose Text Color" aria-haspopup="dialog">▾</button></span>
          <button data-format="clear" title="Clear Text Formatting">Clear</button>
        </div>
        <div id="visual-editor"></div>
        <textarea id="markdown-source" aria-label="Markdown Source" spellcheck="false" hidden></textarea>
      </div>
    </main>
    <footer><span id="save-status" role="status">Starting…</span><span id="document-stats"></span><span>Autosave · Markdown → BBCode</span></footer>
    <dialog id="choice-dialog" aria-labelledby="dialog-title"><h2 id="dialog-title"></h2><p id="dialog-message"></p><input id="dialog-input" aria-label="Value" hidden><div id="dialog-actions"></div></dialog>
    <dialog id="color-dialog" aria-labelledby="color-title">
      <form id="color-form" novalidate>
        <h2 id="color-title">Text Color</h2>
        <div class="color-preview-row"><span id="color-preview" aria-hidden="true"></span><output id="color-preview-value"></output></div>
        <div class="color-sliders">
          <label>Hue <input id="color-hue" type="range" min="0" max="360" step="0.01" aria-label="Hue Slider"></label>
          <label>Saturation <input id="color-saturation" type="range" min="0" max="100" step="0.01" aria-label="Saturation Slider"></label>
          <label>Lightness <input id="color-lightness" type="range" min="0" max="100" step="0.01" aria-label="Lightness Slider"></label>
        </div>
        <label class="color-mode-label" for="color-mode">Value Type</label>
        <select id="color-mode"><option value="hex">Hex</option><option value="rgb">RGB</option><option value="hsl">HSL</option></select>
        <div id="color-hex-fields" class="color-values"><label>Hex <input id="color-hex" type="text" spellcheck="false" autocomplete="off" aria-describedby="color-hex-help color-error"></label><small id="color-hex-help">3 or 6 digits; # is optional.</small></div>
        <div id="color-rgb-fields" class="color-values" hidden><label>Red <input type="number" min="0" max="255" step="1"></label><label>Green <input type="number" min="0" max="255" step="1"></label><label>Blue <input type="number" min="0" max="255" step="1"></label></div>
        <div id="color-hsl-fields" class="color-values" hidden><label>Hue <input type="number" min="0" max="360" step="any"></label><label>Saturation (%) <input type="number" min="0" max="100" step="any"></label><label>Lightness (%) <input type="number" min="0" max="100" step="any"></label></div>
        <p id="color-error" role="alert"></p>
        <div class="color-actions"><button id="color-cancel" type="button">Cancel</button><button type="submit" class="primary">Apply Color</button></div>
      </form>
    </dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
